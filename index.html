<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>엠앤티 인력 데모</title>
<style>
/* 레이아웃: 랜딩 → 근로자(폰 폭 단일 열) / 관리자(상단 바 + 넓은 본문) */
@font-face{font-family:'Pretendard';src:url(fonts/PretendardVariable.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{
  --ink:#14161A; --yellow:#FFC400; --yellow-sh:#B88A00; --soft:#FFF1BF;
  --ground:#F4F5F7; --gray:#E1E4E9; --gray-sh:#B9BEC6; --sub:#4A4F57; --line:#ECEEF1; --danger:#B3261E;
  --font:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{font-variant-numeric:tabular-nums}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:0;transition:transform .09s ease,box-shadow .09s ease,background-color .12s ease}
button:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 transparent!important}
button:disabled{cursor:not-allowed;opacity:.55}
a{color:inherit}
:focus-visible{outline:3px solid #1E4FD8;outline-offset:3px}
input{border:0}
svg{flex-shrink:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:scale(1);opacity:1}}
@keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
@keyframes up{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.pop{animation:pop .22s ease-out}

/* 공통 */
.bar{background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:14px 20px;min-height:56px}
.brand{font-size:18px;font-weight:800;white-space:nowrap}
.home{margin-left:auto;display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;background:#2A2E35;color:#fff;font-size:15px;font-weight:700}
.card{background:#fff;border-radius:20px;box-shadow:0 2px 10px rgba(20,22,26,.06)}
.btn-y{background:var(--yellow);color:var(--ink);box-shadow:0 5px 0 var(--yellow-sh);font-weight:800}
.btn-g{background:var(--gray);color:var(--ink);box-shadow:0 4px 0 var(--gray-sh);font-weight:700}
.btn-w{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--gray-sh);font-weight:700}
.btn-d{background:var(--ink);color:#fff;font-weight:800}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-size:15px;font-weight:700;white-space:nowrap}
.p-dark{background:var(--ink);color:#fff}.p-y{background:var(--yellow)}.p-soft{background:var(--soft)}.p-gray{background:var(--gray);color:var(--sub)}.p-red{background:#FBE4E2;color:var(--danger)}
.new{display:inline-flex;padding:2px 8px;margin-left:8px;border-radius:6px;background:var(--yellow);font-size:13px;font-weight:800;vertical-align:middle}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:14px;font-size:16px;font-weight:700;z-index:50;animation:up .2s ease-out;max-width:calc(100% - 32px);text-align:center}

/* 랜딩 */
.land{min-height:100vh;display:flex;flex-direction:column}
.land-in{flex:1;max-width:960px;width:100%;margin:0 auto;padding:48px 20px;display:flex;flex-direction:column;gap:32px;justify-content:center}
.land h1{margin:0;font-size:clamp(30px,5vw,44px);line-height:1.25;font-weight:800;text-wrap:balance}
.land p{margin:0;font-size:18px;color:var(--sub);font-weight:600}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:18px;padding:32px;border-radius:28px;text-align:left;text-decoration:none;min-height:280px}
.choice .ic{width:88px;height:88px;border-radius:24px;display:flex;align-items:center;justify-content:center}
.choice b{font-size:32px;font-weight:800}
.choice span{font-size:18px;font-weight:600;line-height:1.5}
.choice .go{margin-top:auto;display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800}
.c-w{background:var(--yellow);box-shadow:0 8px 0 var(--yellow-sh)}
.c-w .ic{background:var(--ink)}
.c-a{background:var(--ink);color:#fff;box-shadow:0 8px 0 #000}
.c-a .ic{background:var(--yellow)}
.c-a span{color:#C9CDD3}
.choice:active{transform:translateY(6px);box-shadow:0 2px 0 transparent}
.note{font-size:15px;color:var(--sub);font-weight:600}

/* 근로자 */
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--ground);display:flex;flex-direction:column}
@media (min-width:600px){.phone{box-shadow:0 0 0 1px var(--line),0 10px 40px rgba(20,22,26,.08)}}
.wbody{padding:24px 20px 28px;display:flex;flex-direction:column;gap:18px;flex:1}
.wbody h1{margin:0;font-size:30px;line-height:40px;font-weight:800}
.wstep{display:flex;gap:6px;padding:12px 20px 0;overflow-x:auto}
.wstep button{flex:1 0 auto;height:36px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;background:var(--gray);color:var(--sub)}
.wstep button.on{background:var(--ink);color:var(--yellow)}
.field{display:flex;align-items:center;gap:14px;height:68px;padding:0 18px}
.field input{flex:1;min-width:0;height:56px;font-size:22px;background:transparent}
.lbl{font-size:18px;font-weight:800}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.days button{height:56px;font-size:20px;border-radius:14px;padding:0}
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.skills button{height:100px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:17px;padding:0}
.on-y{background:var(--yellow)!important;box-shadow:0 5px 0 var(--yellow-sh)!important;font-weight:800!important;color:var(--ink)!important}
.big{height:80px;border-radius:20px;font-size:26px}
.row-i{display:flex;align-items:center;gap:16px;padding:16px 0}
.row-i+.row-i{border-top:1px solid var(--line)}
.ibox{width:52px;height:52px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:center}
.val{font-size:26px;line-height:34px;font-weight:800}
.subt{font-size:17px;line-height:24px;color:var(--sub)}
.job{display:flex;align-items:center;gap:16px;padding:18px;border-radius:20px;text-align:left;width:100%}
.date{width:76px;height:84px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.date b{font-size:32px;line-height:34px;font-weight:800}
.status{display:flex;align-items:center;gap:16px;padding:20px;border-radius:20px}
.prog{display:flex;align-items:flex-start;padding:22px 12px}
.prog .st{width:64px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px;font-weight:700}
.prog .dot{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--gray)}
.prog .ln{flex:1;height:6px;margin-top:23px;border-radius:3px;background:var(--gray)}
.sign{height:190px;border-radius:20px;background:#fff;box-shadow:0 2px 10px rgba(20,22,26,.06);display:flex;align-items:center;justify-content:center;position:relative;width:100%;padding:0}
.sign::after{content:"";position:absolute;left:24px;right:24px;bottom:34px;height:2px;background:var(--gray)}
.lnk{align-self:center;display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;font-size:18px;font-weight:700;background:transparent}

/* 관리자 */
.abar{flex-wrap:wrap;padding:12px 4%;gap:10px 28px}
.abar nav{display:flex;flex-wrap:wrap;gap:4px 8px}
.abar nav button{height:44px;padding:0 14px;border-radius:10px;background:transparent;color:#fff;font-size:17px;font-weight:700}
.abar nav button.on{background:#2A2E35;color:var(--yellow)}
.wrap{max-width:1200px;margin:0 auto;padding:28px 4% 60px;display:flex;flex-direction:column;gap:22px}
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.hdr h1{margin:0;font-size:30px;line-height:40px;font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:17px;font-weight:700;color:var(--sub)}
.meta span{display:flex;align-items:center;gap:6px}
.acts{display:flex;flex-wrap:wrap;gap:12px}
.ab{height:56px;padding:0 22px;border-radius:14px;display:inline-flex;align-items:center;gap:10px;font-size:18px}
.sb{height:44px;padding:0 14px;border-radius:12px;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.steps button{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px 0 8px;border-radius:999px;font-size:16px;font-weight:700;background:var(--gray);color:var(--sub)}
.steps button i{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px;font-weight:800}
.steps button.on{background:var(--ink);color:#fff}.steps button.on i{background:var(--yellow)}
.steps .sep{width:24px;height:4px;border-radius:2px;background:#C9CDD3}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.tile{padding:20px;display:flex;align-items:center;gap:16px;border-radius:20px}
.tile .tb{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;background:var(--soft)}
.tile small{display:block;font-size:16px;font-weight:700}
.tile strong{display:block;font-size:44px;line-height:48px;font-weight:800}
.tile strong em{font-style:normal;font-size:22px;font-weight:700}
.t-dark{background:var(--ink);color:#fff}
.split{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.split>.m{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
.split>.s{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px}
.panel{padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0;font-size:16px;font-weight:800}
.panel.dark{background:var(--ink);color:#fff;border-radius:20px}
.panel.dark h2{color:var(--yellow)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:17px}
th{padding:16px 20px 12px;font-size:14px;color:var(--sub);text-align:left;white-space:nowrap}
td{padding:10px 20px;border-top:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
td:first-child{font-weight:700}
tr.sel td{background:#FFFBEA}
tr.clk{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:48px;padding:0 16px;border-radius:14px;background:var(--ground);color:var(--sub);box-shadow:0 4px 0 #C9CDD3;font-size:17px;font-weight:600}
.chip.on{background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 var(--yellow-sh);font-weight:800}
.cell{width:68px;height:54px;border-radius:14px;font-size:22px;font-weight:800;background:var(--soft)}
.cell.empty{background:var(--ground);color:#9AA0A8;font-size:14px;font-weight:700;box-shadow:inset 0 0 0 2px var(--gray)}
.cell.sel{background:var(--ink);color:var(--yellow)}
.cell.off{background:transparent;color:#9AA0A8;font-size:14px;font-weight:700;cursor:default}
.stepper{display:flex;align-items:center;gap:10px;height:68px;padding:0 8px;background:var(--ground);border-radius:14px}
.stepper button{width:52px;height:52px;border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--gray-sh);display:flex;align-items:center;justify-content:center}
.stepper output{flex:1;text-align:center;font-size:30px;font-weight:800}
.bubble{background:var(--soft);border-radius:18px 18px 18px 4px;padding:16px;font-size:17px;line-height:27px;font-weight:600}
.fill{display:flex;flex-direction:column;gap:12px}
.fill div{display:flex;align-items:center;gap:12px}
.fill i{width:32px;height:32px;border-radius:50%;background:#2A2E35;color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800}
.fill .done i{background:var(--yellow);color:var(--ink)}
.fill b{display:block;font-size:17px}.fill small{display:block;font-size:14px;color:#C9CDD3}
.centers{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.crow{display:flex;align-items:center;gap:10px;font-size:16px}
.crow .ibox{width:36px;height:36px;border-radius:10px}
.crow .k{width:70px;font-weight:700;color:var(--sub)}
.crow .v{font-weight:700}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stat3 div{background:var(--ground);border-radius:14px;padding:12px 4px}
.stat3 b{display:block;font-size:26px}.stat3 small{font-size:14px;font-weight:700;color:var(--sub)}
.modal{position:fixed;inset:0;background:rgba(20,22,26,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:40}
.modal .box{background:#fff;border-radius:24px;padding:24px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.sheet{height:220px;border-radius:16px;background:#2A2E35;display:flex;align-items:center;justify-content:center}
.paper{width:240px;height:170px;border-radius:6px;background:#fff;transform:rotate(-3deg);padding:16px;display:flex;flex-direction:column;gap:9px;font-size:12px;font-weight:700;color:var(--sub)}
.paper i{display:block;height:8px;border-radius:3px;background:var(--gray)}

/* 관리자 모바일 */
.wk td:first-child,.wk th:first-child{position:sticky;left:0;background:#fff;z-index:1;box-shadow:6px 0 8px -6px rgba(20,22,26,.15)}
@media (max-width:720px){
 .abar{padding:10px 16px 0}
 .abar nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;gap:4px;margin:0 -4px;padding-bottom:10px;scrollbar-width:none}
 .abar nav::-webkit-scrollbar{display:none}
 .abar nav button{flex:1 0 auto;height:46px;font-size:17px}
 .abar .home{margin-left:auto}
 .wrap{padding:20px 16px 48px;gap:18px}
 .acts{width:100%}
 .acts .ab{flex:1 1 auto;justify-content:center}
 .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
 .tile{padding:14px;gap:10px;flex-direction:column;align-items:flex-start}
 .tile .tb{width:48px;height:48px;border-radius:14px}
 .tile .tb svg{width:26px;height:26px}
 .tile>svg{width:64px;height:64px}
 .tile strong{font-size:34px;line-height:38px}
 .rt table{min-width:0!important}
 .rt thead{display:none}
 .rt tr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:14px 16px;border-top:1px solid var(--line)}
 .rt tr:first-child{border-top:0}
 .rt td{border:0;padding:0;white-space:normal;display:flex;align-items:center;gap:6px;font-size:16px}
 .rt td::before{content:attr(data-label);font-size:13px;font-weight:700;color:var(--sub)}
 .rt td:first-child{flex:1 1 100%;font-size:19px;font-weight:800}
 .rt td:first-child::before,.rt td:last-child::before{content:none}
 .rt td:last-child{margin-left:auto}
 .rt td.r{text-align:left}
 .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
 .chips::-webkit-scrollbar{display:none}
 .chip{flex:0 0 auto}
 .cell{width:56px;height:50px;font-size:20px}
 .centers{grid-template-columns:1fr}
}
@media (max-width:480px){.hdr h1{font-size:26px;line-height:34px}.ab{height:52px;padding:0 16px;font-size:17px}}
</style>
</head>

document.addEventListener('click',function(e){

  case 'promote': a.roster.forEach(function(r){if(r.id==+v)r.st='confirmed';}); toast('확정으로 바꿨습니다'); break;
